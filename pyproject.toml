[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footballvision"
version = "0.1.0"
description = "Single-camera football video analysis pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
video = ["opencv-python-headless>=4.10,<5"]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
