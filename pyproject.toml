[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footballvision"
version = "0.1.0"
description = "Single-camera football video analysis pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
video = ["opencv-python>=4.10,<5"]
runtime = ["opencv-python>=4.10,<5", "ultralytics>=8.3,<9"]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["app*", "contracts*", "detection*", "ingestion*", "teams*", "tracking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
